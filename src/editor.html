<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zang Pitch Correction AI</title>
<style>/* STYLE */</style></head><body>
<header><div class="brand"><b class="mark" aria-hidden="true">∿</b><div><h1>Zang <span>Pitch Correction</span></h1><small>STANDALONE BETA · 0.3</small></div></div>
<nav><details class="projectMenu"><summary>Project</summary><div><button id="newProject">New project</button><button id="openProject">Open project</button><button id="stem">Export active WAV</button></div></details><button id="save">Save project</button><button id="export" class="accent">Export stems ↗</button></nav></header>
<div class="layout"><aside><div class="section"><h2>Mixer</h2><span id="trackCount">0</span></div>
<button id="import" class="full">＋ Import WAVs</button><button id="importBacking" class="full">Import backing WAV</button><div id="tracks"></div>
<div class="panel"><details><summary>Pitch settings</summary><label>Chord guide<select id="chordGuide"><option value="-1">Key and scale only</option></select></label><div class="pair"><label>Key<select id="root"></select></label><label>Scale<select id="scale"><option value="chromatic">Chromatic</option><option value="major">Major</option><option value="minor">Minor</option></select></label></div>
<label>Pitch strength <output id="strengthOut">85%</output><input type="range" id="strength" min="0" max="100" value="85"></label></details><button id="tune" class="full teal">Tune checked tracks</button>
<details><summary>Timing</summary><div class="pair"><label>Tempo<input type="number" id="bpm" min="20" max="400" value="120"></label><label>Grid<select id="grid"><option value="4">1/4</option><option value="8" selected>1/8</option><option value="16">1/16</option><option value="12">1/8 triplet</option></select></label></div>
<label>Timing strength <output id="timeOut">65%</output><input type="range" id="timing" min="0" max="100" value="65"></label><button id="quant" class="full">Correct to grid</button><button id="firstpass" class="full teal">Tune + correct timing</button>
</details><details><summary>BGV alignment</summary><label>Guide track<select id="guide"></select></label><button id="align" class="full">Align checked BGVs</button></details></div></aside>
<main><div class="editHead"><div><h2 id="projectTitle">Untitled project</h2></div><select id="view" aria-label="Track view"><option value="stacked">Stacked lanes</option><option value="overlay">Pitch overlay</option></select></div>
<div class="toolbar"><button id="toolButton" aria-haspopup="dialog" aria-expanded="false" title="Choose tool (right-click the editor)">Main tool ▾</button><button id="monitor" aria-pressed="true" title="Audition vocal notes while editing">Monitor on</button><button id="undo" title="Undo (⌘Z)">↶ Undo</button><button id="redo" title="Redo (⇧⌘Z)">↷ Redo</button><label class="zoom">Zoom <input id="zoom" type="range" min="1" max="48" step="any" value="1"></label></div>
<div id="timeline"><canvas tabindex="0" id="canvas" aria-label="Vocal pitch timeline"></canvas><div id="empty"><div class="wave" aria-hidden="true">∿</div><h2>Drop your vocal stems here</h2><p>Import WAVs with the same start time, or try a three-part demo.</p><button id="demo">Load demo stack</button></div></div>
<label class="pan">Timeline position <input id="pan" type="range" min="0" max="1000" step="any" value="0"></label>
<div class="transport"><button id="play" class="accent">▶ Play</button><button id="rewind" title="Return to start">↤</button><strong id="clock">0:00.00</strong><button id="ab" aria-pressed="false">Listen: Edited</button><span id="duration"></span></div>
<footer role="status" id="status">Ready</footer></main></div>
<div id="toolPalette" role="dialog" aria-label="Editing tools" hidden></div>
<input type="file" id="backingFile" accept=".wav,.wave,audio/wav" hidden><input type="file" id="audioFiles" multiple accept=".wav,.wave,audio/wav" hidden><input type="file" id="projectFile" accept=".zpitch" hidden>
<script id="dsp-source" type="text/plain">/* ENGINE */</script><script>/* APP */</script></body></html>
